<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vợ chồng nghèo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#1e293b;border-radius:16px;width:min(440px,95vw);box-shadow:0 10px 40px #0008}
  #login{padding:28px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0 0 6px;font-size:22px}
  input{padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:inherit;font-size:15px}
  button{padding:12px 18px;border:0;border-radius:10px;background:#6366f1;color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#4f46e5}
  #chat{display:none;height:min(680px,95vh);flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;font-size:14px}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:82%;padding:9px 13px;border-radius:14px;background:#334155;word-wrap:break-word;white-space:pre-wrap;position:relative;transition:transform 0.15s ease-out;user-select:none}
  .m.me{align-self:flex-end;background:#6366f1}
  .m-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .m small{opacity:.65;font-size:11px}
  .m-actions{display:flex;gap:6px;margin-left:8px}
  .m-del{background:transparent;border:0;color:#fca5a5;cursor:pointer;font-size:12px;padding:0 2px;opacity:0.8}
  .m-del:hover{opacity:1;color:#ef4444}
  .m-reply{background:transparent;border:0;color:#cbd5e1;cursor:pointer;font-size:12px;padding:0 2px;opacity:0.8}
  .m-reply:hover{opacity:1;color:#fff}
  .reply-quote{background:rgba(0,0,0,0.25);border-left:3px solid #38bdf8;padding:4px 8px;border-radius:4px;margin-bottom:6px;font-size:12px;color:#cbd5e1}
  .reply-quote b{color:#38bdf8}
  #replyBar{display:none;align-items:center;justify-content:space-between;padding:6px 14px;background:#1e293b;border-top:1px solid #334155;font-size:13px}
  #replyText{color:#38bdf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80vw}
  #cancelReply{background:transparent;border:0;color:#94a3b8;font-size:16px;cursor:pointer}
  .sys{align-self:center;font-size:12px;opacity:.6}
  #typing{height:18px;padding:0 18px;font-size:12px;opacity:.6}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid #334155}
  form input{flex:1}
  #err{color:#f87171;font-size:13px}
  #chat{background-size:cover;background-position:center}
  #msgs{background:transparent}
  .tools button{padding:4px 9px;font-size:14px;background:#334155;margin-left:6px}
  .tools button:hover{background:#475569}
  .sys{background:#0f172a99;padding:2px 10px;border-radius:10px;opacity:.9}
  header,form,#typing{background:#1e293bcc}
  #callBtn, #videoBtn { background: #16a34a; }
  #callBtn:hover, #videoBtn:hover { background: #15803d; }
  #callbar{display:none;justify-content:space-between;align-items:center;padding:10px 16px;background:#16a34acc;font-size:15px;z-index:50}
  #callbar button{padding:6px 12px;font-size:13px;margin-left:6px;border-radius:8px}
  #callHang{background:#dc2626}
  #callAccept{background:#16a34a;font-weight:bold;animation:pulse 1s infinite}
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  #videoBox{display:none;position:fixed;inset:0;background:#000;z-index:9999;width:100vw;height:100vh}
  #remoteVideo{width:100%;height:100%;object-fit:cover}
  #localVideo{position:absolute;right:16px;bottom:100px;width:100px;height:145px;object-fit:cover;border-radius:12px;border:2px solid #fff;transform:scaleX(-1);background:#222;z-index:10000;box-shadow:0 4px 15px rgba(0,0,0,0.6)}
  #videoBox.fullscreen #callbar{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#0f172aee;border-radius:35px;padding:10px 24px;width:max-content;max-width:92vw;z-index:10001;box-shadow:0 4px 20px rgba(0,0,0,0.7);display:flex}
  .m.call-log{align-self:center;background:#1e293bdd;border:1px solid #334155;border-radius:14px;padding:8px 16px;font-size:13px;display:flex;align-items:center;gap:8px;max-width:90%}
  .call-icon{font-size:16px}
  .m .pic{display:block;max-width:240px;max-height:260px;width:auto;height:auto;border-radius:10px;margin-top:4px;cursor:zoom-in}
  .pic-wrapper{position:relative;display:inline-block}
  #imgBtn{background:#334155;padding:12px 14px}
  #galleryModal{display:none;position:fixed;inset:0;background:#000c;z-index:9000;align-items:center;justify-content:center}
  .gallery-content{background:#1e293b;border-radius:16px;width:min(500px,94vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
  .gallery-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #334155}
  .gallery-header h3{margin:0;font-size:16px}
  #galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding:16px;overflow-y:auto;max-height:calc(85vh - 65px)}
  .gallery-item{position:relative;width:100%;height:90px}
  .gallery-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:pointer}
  .gallery-del{position:absolute;top:4px;right:4px;background:#ef4444dd;color:#fff;border:0;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;padding:0}
  #galleryEmpty{grid-column:1/-1;text-align:center;padding:30px 10px;opacity:.6;font-size:14px}
  #lightbox{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;z-index:10005;cursor:zoom-out}
  #lightbox img{max-width:95vw;max-height:95vh;border-radius:8px}
</style>
</head>
<body>
<div class="card">
  <div id="login">
    <h1>💬 Vợ chồng nghèo</h1>
    <input id="name" placeholder="Tên của bạn" maxlength="30">
    <input id="room" placeholder="Mã phòng (gửi cho bạn bè)" maxlength="50">
    <input id="pass" type="password" placeholder="Mật khẩu phòng (người đầu tiên đặt)" maxlength="100" autocomplete="current-password">
    <button id="join">Vào phòng</button>
    <div id="err"></div>
  </div>
  <div id="chat">
    <header><span id="title"></span><span id="status"></span>
      <span class="tools">
        <button id="galleryBtn" title="Thư viện ảnh đã gửi">📸</button>
        <button id="callBtn" title="Gọi thoại">📞</button>
        <button id="videoBtn" title="Gọi video">🎥</button>
        <button id="bgBtn" title="Đổi hình nền">🖼️</button>
        <input type="file" id="bgFile" accept="image/*" hidden>
      </span>
    </header>
    <div id="callbar"><span id="callText"></span>
      <span><button id="callAccept">✅ Nghe</button><button id="callMute">🎤</button><button id="callCam" title="Bật/tắt camera">📹</button><button id="callHang">📵 Cúp</button></span>
    </div>
    <div id="videoBox"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div>
    <div id="msgs"></div>
    <div id="replyBar">
      <span id="replyText"></span>
      <button id="cancelReply" type="button" title="Hủy trả lời">✖</button>
    </div>
    <form id="form">
      <button type="button" id="imgBtn" title="Gửi ảnh">📎</button>
      <input id="text" placeholder="Nhập tin nhắn..." autocomplete="off">
      <button>Gửi</button>
      <input type="file" id="imgFile" accept="image/*" multiple hidden>
    </form>
  </div>
</div>
<!-- Modal Thư viện ảnh -->
<div id="galleryModal">
  <div class="gallery-content">
    <div class="gallery-header">
      <h3>📸 Thư viện ảnh (30 ngày)</h3>
      <button id="closeGallery" style="background:transparent;font-size:20px;padding:4px 8px;cursor:pointer">✖</button>
    </div>
    <div id="galleryGrid"></div>
  </div>
</div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lightImg" alt=""></div>
<script>
const $ = id => document.getElementById(id);
let ws, myName, typingTimer, lastTyping = 0;
const params = new URLSearchParams(location.search);
if (params.get('room')) $('room').value = params.get('room');

function add(cls, html) {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html;
  $('msgs').appendChild(d); $('msgs').scrollTop = 1e9;
  return d;
}
let currentReply = null;

function setReply(m) {
  currentReply = {
    id: m.id,
    name: m.name,
    text: m.text ? (m.text.length > 50 ? m.text.slice(0, 50) + '...' : m.text) : (m.image ? '[Hình ảnh]' : '[Cuộc gọi]')
  };
  $('replyText').textContent = `Đang trả lời ${currentReply.name === myName ? 'chính bạn' : currentReply.name}: "${currentReply.text}"`;
  $('replyBar').style.display = 'flex';
  $('text').focus();
}

function clearReply() {
  currentReply = null;
  $('replyBar').style.display = 'none';
  $('replyText').textContent = '';
}

$('cancelReply').onclick = clearReply;

function addChat(m) {
  const me = m.name === myName, when = new Date(m.time);
  const t = when.toDateString() === new Date().toDateString()
    ? when.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
    : when.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  
  if (m.isCallLog) {
    const icon = m.callType === 'video' ? '🎥' : '📞';
    const desc = m.duration > 0 ? `Cuộc gọi ${m.callType === 'video' ? 'video' : 'thoại'} (${formatDuration(m.duration)})` : `Cuộc gọi ${m.callType === 'video' ? 'video' : 'thoại'} nhỡ`;
    const d = add('m call-log', `<span class="call-icon">${icon}</span> <span><b>${me ? 'Bạn' : esc(m.name)}</b>: ${desc} · <small style="opacity:.7">${t}</small></span>`);
    if (m.id) d.id = 'msg_' + m.id;
    return;
  }

  let replyHtml = '';
  if (m.replyTo) {
    replyHtml = `<div class="reply-quote"><b>${esc(m.replyTo.name)}</b>: ${esc(m.replyTo.text)}</div>`;
  }

  const d = document.createElement('div');
  d.className = 'm' + (me ? ' me' : '');
  if (m.id) d.id = 'msg_' + m.id;

  d.innerHTML = `
    <div class="m-header">
      <small>${me ? 'Bạn' : esc(m.name)} · ${t}</small>
      <span class="m-actions">
        <button class="m-reply" title="Trả lời tin nhắn">↩</button>
        ${me && m.id ? `<button class="m-del" title="Xóa tin nhắn của bạn">🗑️</button>` : ''}
      </span>
    </div>
    ${replyHtml}
    ${m.text ? `<div>${esc(m.text)}</div>` : ''}
  `;

  if (m.image) {
    if (m.id) allImages.unshift({ id: m.id, src: m.image, name: m.name });
    const imgWrap = document.createElement('div');
    imgWrap.className = 'pic-wrapper';
    const img = document.createElement('img');
    img.className = 'pic';
    img.src = m.image;
    img.onload = () => { $('msgs').scrollTop = 1e9; };
    img.onclick = () => { $('lightImg').src = m.image; $('lightbox').style.display = 'flex'; };
    imgWrap.appendChild(img);
    d.appendChild(imgWrap);
  }

  // Sự kiện nút Reply và Delete trên tin nhắn
  const replyBtn = d.querySelector('.m-reply');
  if (replyBtn) replyBtn.onclick = (e) => { e.stopPropagation(); setReply(m); };
  
  const delBtn = d.querySelector('.m-del');
  if (delBtn) {
    delBtn.onclick = (e) => {
      e.stopPropagation();
      if (confirm('Bạn có chắc muốn xóa tin nhắn / ảnh này không?')) {
        ws.send(JSON.stringify({ type: 'delete', id: m.id }));
      }
    };
  }

  // Vuốt ngang (Swipe to reply) trên điện thoại và cảm ứng
  let startX = 0, currentX = 0, isSwiping = false;
  d.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    isSwiping = true;
  }, { passive: true });

  d.addEventListener('touchmove', e => {
    if (!isSwiping) return;
    currentX = e.touches[0].clientX;
    const diff = currentX - startX;
    if (diff > 10 && diff < 80) { // Vuốt sang phải
      d.style.transform = `translateX(${diff}px)`;
    }
  }, { passive: true });

  d.addEventListener('touchend', e => {
    if (!isSwiping) return;
    isSwiping = false;
    const diff = currentX - startX;
    d.style.transform = '';
    if (diff > 50) {
      setReply(m);
    }
  });

  $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e9;
}

const allImages = []; // { id, src, name }

function renderGallery() {
  const g = $('galleryGrid');
  g.innerHTML = '';
  if (!allImages.length) {
    g.innerHTML = '<div id="galleryEmpty">Chưa có hình ảnh nào được gửi trong 30 ngày qua.</div>';
    return;
  }
  allImages.forEach(item => {
    const wrap = document.createElement('div');
    wrap.className = 'gallery-item';
    wrap.id = 'gal_' + item.id;
    const isMine = item.name === myName;
    wrap.innerHTML = `
      <img src="${item.src}">
      ${isMine ? `<button class="gallery-del" title="Xóa ảnh này">✕</button>` : ''}
    `;
    wrap.querySelector('img').onclick = () => { $('lightImg').src = item.src; $('lightbox').style.display = 'flex'; };
    if (isMine) {
      wrap.querySelector('.gallery-del').onclick = (e) => {
        e.stopPropagation();
        if (confirm('Xóa ảnh này khỏi thư viện và đoạn chat?')) {
          ws.send(JSON.stringify({ type: 'delete', id: item.id }));
        }
      };
    }
    g.appendChild(wrap);
  });
}

$('galleryBtn').onclick = () => { renderGallery(); $('galleryModal').style.display = 'flex'; };
$('closeGallery').onclick = () => { $('galleryModal').style.display = 'none'; };
$('galleryModal').onclick = e => { if (e.target === $('galleryModal')) $('galleryModal').style.display = 'none'; };

function formatDuration(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m} phút ${s} giây` : `${s} giây`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('join').onclick = () => {
  const name = $('name').value.trim(), room = $('room').value.trim(), password = $('pass').value;
  if (!name || !room || !password) return $('err').textContent = 'Nhập đủ tên, mã phòng và mật khẩu.';
  if (password.length < 4) return $('err').textContent = 'Mật khẩu tối thiểu 4 ký tự.';
  $('err').textContent = '';
  myName = name;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', room, name, password }));
  ws.onclose = () => { if ($('chat').style.display === 'flex') add('sys', 'Mất kết nối.'); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'error') { $('err').textContent = m.text; ws.close(); }
    else if (m.type === 'joined') {
      $('login').style.display = 'none'; $('chat').style.display = 'flex';
      $('title').textContent = 'Phòng: ' + m.room;
    } else if (m.type === 'system') {
      add('sys', esc(m.text));
      $('status').textContent = m.count === 2 ? '🟢 2/2 online' : '🟡 Đang chờ người kia...';
      if (m.count < 2 && (inCall || pendingOffer)) endCall(false);
    } else if (m.type === 'history') {
      m.messages.forEach(addChat);
    } else if (m.type === 'chat') {
      addChat(m);
      $('typing').textContent = '';
      if (m.name !== myName) notify(m.name, m.text || '📷 Đã gửi một ảnh');
    } else if (m.type === 'deleted') {
      // Xóa tin nhắn khỏi màn hình chat
      const el = $('msg_' + m.id);
      if (el) el.remove();
      // Xóa khỏi danh sách thư viện ảnh
      const idx = allImages.findIndex(img => img.id === m.id);
      if (idx !== -1) {
        allImages.splice(idx, 1);
        const galEl = $('gal_' + m.id);
        if (galEl) galEl.remove();
      }
    } else if (m.type === 'bg') {
      applyBg(m.data);
    } else if (m.type === 'signal') {
      onSignal(m.data).catch(console.error);
    } else if (m.type === 'typing') {
      $('typing').textContent = m.name + ' đang nhập...';
      clearTimeout(typingTimer); typingTimer = setTimeout(() => $('typing').textContent = '', 1500);
    }
  };
};

function applyBg(url) {
  $('chat').style.backgroundImage = url ? `linear-gradient(#0f172a80,#0f172a80),url(${url})` : '';
}

function resizeImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

$('bgBtn').onclick = () => $('bgFile').click();
$('bgFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { ws.send(JSON.stringify({ type: 'bg', data: await resizeImage(f, 1000, 0.75) })); }
  catch { alert('Không đọc được ảnh.'); }
};

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || ws.readyState !== 1) return;
  const payload = { type: 'chat', text };
  if (currentReply) {
    payload.replyTo = currentReply;
    clearReply();
  }
  ws.send(JSON.stringify(payload));
  $('text').value = '';
};

$('text').oninput = () => {
  if (Date.now() - lastTyping > 1000) { lastTyping = Date.now(); ws.send(JSON.stringify({ type: 'typing' })); }
};

// ===== Gửi nhiều ảnh cùng lúc =====
$('imgBtn').onclick = () => $('imgFile').click();
$('imgFile').onchange = async e => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (!files.length || ws.readyState !== 1) return;
  for (const f of files) {
    try {
      const imgData = await resizeImage(f, 1000, 0.75);
      const payload = { type: 'chat', image: imgData };
      if (currentReply) {
        payload.replyTo = currentReply;
        clearReply();
      }
      ws.send(JSON.stringify(payload));
    } catch {
      console.error('Lỗi đọc ảnh:', f.name);
    }
  }
};

// ===== Bật/tắt camera trong cuộc gọi =====
$('callCam').onclick = () => {
  const t = localStream && localStream.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('callCam').textContent = t.enabled ? '📹' : '🚫';
};

// ===== Thông báo tin nhắn mới =====
let unread = 0, audioCtx;
const baseTitle = document.title;
function beep() {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  } catch {}
}
function notify(title, body) {
  if (!document.hidden) return; // đang xem tab thì không cần báo
  unread++; document.title = `(${unread}) ${baseTitle}`;
  beep();
  try {
    if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { unread = 0; document.title = baseTitle; }
});

let ringTimer = null;
// Nhạc chuông iPhone Marimba kinh điển tạo bằng Web Audio
function startRingtone() {
  stopRingtone();
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
  function playMarimbaBar(freq, time) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, time);
    // Độ nảy và âm sắc gõ mộc bản quyền iPhone Marimba
    gain.gain.setValueAtTime(0.18, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.28);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(time); osc.stop(time + 0.3);
  }
  // Giai điệu Marimba: C6, A5, F5, D5, G5, E5, C5...
  const notes = [
    { f: 1046.5, d: 0.00 }, // C6
    { f: 880.00, d: 0.14 }, // A5
    { f: 698.46, d: 0.28 }, // F5
    { f: 587.33, d: 0.42 }, // D5
    { f: 783.99, d: 0.56 }, // G5
    { f: 659.25, d: 0.70 }, // E5
    { f: 523.25, d: 0.84 }, // C5
    { f: 659.25, d: 1.05 }, // E5
    { f: 783.99, d: 1.19 }, // G5
    { f: 1046.5, d: 1.33 }, // C6
    { f: 880.00, d: 1.47 }  // A5
  ];
  function playPhrase() {
    if (!audioCtx) return;
    const start = audioCtx.currentTime;
    notes.forEach(n => playMarimbaBar(n.f, start + n.d));
  }
  playPhrase();
  ringTimer = setInterval(playPhrase, 2200);
}
function stopRingtone() {
  if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
}

// ===== Gọi thoại & Video (WebRTC) =====
let pc, localStream, pendingOffer, pendingIce = [], inCall = false;
let callStartTime = 0, callDurationTimer = null, callInitiator = false;
let activeCallType = 'voice';

const sig = data => ws.send(JSON.stringify({ type: 'signal', data }));

function showCall(text, { accept = false, hang = false, mute = false, cam = false } = {}) {
  $('callbar').style.display = text ? 'flex' : 'none';
  $('callText').textContent = text || '';
  $('callAccept').style.display = accept ? '' : 'none';
  $('callHang').style.display = hang || accept ? '' : 'none';
  $('callMute').style.display = mute ? '' : 'none';
  $('callCam').style.display = cam ? '' : 'none';
  $('callMute').textContent = '🎤';
  $('callCam').textContent = '📹';
  if (accept) {
    startRingtone();
    notify('Vợ chồng nghèo', text);
  }
}
let callVideo = false, pendingVideo = false;

function startCallTimer() {
  callStartTime = Date.now();
  if (callDurationTimer) clearInterval(callDurationTimer);
  callDurationTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const m = Math.floor(elapsed / 60), s = elapsed % 60;
    const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    $('callText').textContent = (callVideo ? '🎥 ' : '🔊 ') + timeStr;
  }, 1000);
}

function newPC() {
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = e => e.candidate && sig({ kind: 'ice', candidate: e.candidate });
  pc.ontrack = e => { $('remoteVideo').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === 'connected') {
      stopRingtone();
      startCallTimer();
      showCall(callVideo ? '🎥 Đang kết nối...' : '🔊 Đang kết nối...', { hang: true, mute: true, cam: callVideo });
    }
    if (pc && ['failed', 'disconnected', 'closed'].includes(pc.connectionState)) endCall(false);
  };
}

async function getMedia(video) {
  if (!navigator.mediaDevices) throw new Error('Trình duyệt cần HTTPS hoặc localhost để dùng micro/camera.');
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: 'user' } : false });
  callVideo = video;
  $('localVideo').srcObject = localStream;
  if (video) {
    $('videoBox').classList.add('fullscreen');
    $('videoBox').style.display = 'block';
  } else {
    $('videoBox').style.display = 'none';
  }
  $('localVideo').style.display = video ? '' : 'none';
}

function logCallHistory(duration) {
  if (!callInitiator) return; // Chỉ người khởi xướng gửi 1 tin nhắn log để tránh trùng lặp
  const logMsg = {
    type: 'chat',
    text: '',
    isCallLog: true,
    callType: activeCallType,
    duration: duration,
    time: Date.now()
  };
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(logMsg));
}

function endCall(notify = true) {
  stopRingtone();
  let duration = 0;
  if (callStartTime > 0) {
    duration = Math.floor((Date.now() - callStartTime) / 1000);
    clearInterval(callDurationTimer);
    callDurationTimer = null;
  }
  if (inCall) logCallHistory(duration);

  if (notify && inCall && ws.readyState === 1) sig({ kind: 'end' });
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $('remoteVideo').srcObject = null; $('localVideo').srcObject = null;
  $('videoBox').style.display = 'none';
  $('videoBox').classList.remove('fullscreen');
  pendingOffer = null; pendingIce = []; inCall = false; callVideo = false; pendingVideo = false;
  callStartTime = 0; callInitiator = false;
  showCall('');
}

async function startCall(video) {
  if (inCall) return;
  if ($('status').textContent.indexOf('2/2') < 0) return alert('Người kia chưa online.');
  try {
    activeCallType = video ? 'video' : 'voice';
    callInitiator = true;
    await getMedia(video); inCall = true; newPC();
    showCall(video ? '🎥 Đang gọi video...' : '📞 Đang gọi...', { hang: true });
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    sig({ kind: 'offer', sdp: offer, video });
  } catch (err) { alert(err.message); endCall(false); }
}

$('callBtn').onclick = () => startCall(false);
$('videoBtn').onclick = () => startCall(true);

$('callAccept').onclick = async () => {
  try {
    activeCallType = pendingVideo ? 'video' : 'voice';
    callInitiator = false;
    await getMedia(pendingVideo); inCall = true; newPC();
    await pc.setRemoteDescription(pendingOffer); pendingOffer = null;
    for (const c of pendingIce) await pc.addIceCandidate(c); pendingIce = [];
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
    sig({ kind: 'answer', sdp: ans });
    showCall('Đang kết nối...', { hang: true });
  } catch (err) { alert(err.message); sig({ kind: 'end' }); endCall(false); }
};

$('callHang').onclick = () => {
  if (!inCall && pendingOffer) sig({ kind: 'end' }); // từ chối cuộc gọi đến
  endCall(inCall);
};

$('callMute').onclick = () => {
  const t = localStream && localStream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('callMute').textContent = t.enabled ? '🎤' : '🔇';
};

$('callCam').onclick = () => {
  const t = localStream && localStream.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; $('callCam').textContent = t.enabled ? '📹' : '🚫';
};

async function onSignal(d) {
  if (d.kind === 'offer') {
    if (inCall || pendingOffer) return sig({ kind: 'end' });
    pendingOffer = d.sdp; pendingIce = []; pendingVideo = !!d.video;
    activeCallType = pendingVideo ? 'video' : 'voice';
    callInitiator = false;
    showCall(pendingVideo ? '🎥 Có cuộc gọi video đến...' : '📞 Có cuộc gọi đến...', { accept: true });
  } else if (d.kind === 'answer' && pc) {
    await pc.setRemoteDescription(d.sdp);
    for (const c of pendingIce) await pc.addIceCandidate(c); pendingIce = [];
  } else if (d.kind === 'ice') {
    if (pc && pc.remoteDescription) await pc.addIceCandidate(d.candidate);
    else pendingIce.push(d.candidate);
  } else if (d.kind === 'end') {
    const was = inCall || pendingOffer;
    endCall(false);
    if (was) add('sys', 'Cuộc gọi đã kết thúc.');
  }
}
</script>
</body>
